<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — Pmail</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
      }

      body {
        background-color: #0A0A0F;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        max-width: 360px;
        width: 100%;
      }

      .icon {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background-color: rgba(99, 102, 241, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon svg {
        width: 36px;
        height: 36px;
        stroke: #6366F1;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #ffffff;
      }

      p {
        font-size: 1rem;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.55);
      }

      button {
        margin-top: 0.5rem;
        padding: 0.75rem 2rem;
        background-color: #6366F1;
        color: #ffffff;
        border: none;
        border-radius: 0.5rem;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.1s ease;
      }

      button:hover {
        background-color: #4F46E5;
      }

      button:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3l1.664 1.664M21 21l-1.5-1.5m-5.485-1.242L12 17.25 4.5 21V8.742m.164-4.078a2.15 2.15 0 011.743-.44L21 4.5v10.75" />
        </svg>
      </div>

      <h1>You're offline</h1>

      <p>
        No internet connection detected. Check your network settings and try again.
      </p>

      <button onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
